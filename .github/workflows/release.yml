name: catalog
on:
  push:
    branches: [main]
    tags: ['r*']
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Nushell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.116.1 --repo nushell/nushell --pattern nu-0.116.1-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf nu-0.116.1-x86_64-unknown-linux-gnu.tar.gz
          echo "$PWD/nu-0.116.1-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Verify catalog
        run: nu scripts/verify.nu
      - name: Publish manifest
        if: startsWith(github.ref, 'refs/tags/r')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nu scripts/verify.nu --release "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" manifest.json --verify-tag --generate-notes
